name: Final Full Regression

on:
  workflow_dispatch:
  push:
    branches:
      - version-16
    paths-ignore:
      - '**.js'
      - '**.vue'
      - '**.css'
      - '**.ts'
  pull_request:
    branches:
      - version-16
    paths-ignore:
      - '**.js'
      - '**.vue'
      - '**.css'
      - '**.ts'

permissions:
  contents: read

concurrency:
  group: version-16-wiki-final-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

env:
  FRAPPE_REF: v16.34.0
  FRAPPE_COMMIT: c1f1e8ec3708750d7254f7f99d869ffb9886f19f
  OFFICIAL_WIKI_SHA: 0c0adb06b9deb84d11d1f95e85df891c2a29f8da

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Verify Wiki 3.2.1 lineage
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          ns = {}
          exec(open('wiki/__init__.py', encoding='utf-8').read(), ns)
          print(ns['__version__'])
          PY
          )" = "3.2.1"
          git merge-base --is-ancestor "$OFFICIAL_WIKI_SHA" HEAD

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Run static capability contracts
        run: |
          set -euo pipefail
          node scripts/check-v321-capability-contracts.mjs
          node scripts/check-cn-i18n-foundation.mjs
          node scripts/check-cn-public-actions.mjs
          node scripts/check-cn-seed.mjs
          node scripts/check-cn-visible-brand.mjs
          python tests/test_sync_status_i18n_static.py
          python tests/test_image_viewer_zoom_static.py

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt update && sudo apt-get install mariadb-client

      - name: Setup
        run: |
          set -euo pipefail
          pip install frappe-bench
          bench init --frappe-branch "$FRAPPE_REF" --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          actual_frappe_commit="$(git -C ~/frappe-bench/apps/frappe rev-parse HEAD)"
          if [ "$actual_frappe_commit" != "$FRAPPE_COMMIT" ]; then
            echo "Frappe drift: expected $FRAPPE_COMMIT, got $actual_frappe_commit" >&2
            exit 1
          fi
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          set -euo pipefail
          bench get-app wiki "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app wiki
          bench --site test_site migrate
          bench build --app wiki
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          set -euo pipefail
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app wiki
        env:
          TYPE: server

      - name: Regression summary
        run: |
          echo "FRAPPE_REF=$FRAPPE_REF"
          echo "FRAPPE_COMMIT=$FRAPPE_COMMIT"
          echo "OFFICIAL_WIKI_SHA=$OFFICIAL_WIKI_SHA"
          echo "WIKI_FINAL_FULL_REGRESSION=PASS"
