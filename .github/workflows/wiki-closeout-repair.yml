name: Wiki Closeout Repair

on:
  push:
    branches:
      - fix/wiki-v3.2.1-runtime-closeout-repair-20261002

permissions:
  contents: write

concurrency:
  group: wiki-closeout-repair
  cancel-in-progress: true

env:
  OFFICIAL_WIKI_SHA: 0c0adb06b9deb84d11d1f95e85df891c2a29f8da

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/wiki-v3.2.1-runtime-closeout-repair-20261002
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch runtime regression test and failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('wiki/frappe_wiki/doctype/wiki_change_request/wiki_change_request_test_base.py')
          text = test_path.read_text()
          old_import = 'from wiki.frappe_wiki.doctype.wiki_document.wiki_sqlite_search import WikiSQLiteSearch'
          new_import = 'from wiki.frappe_wiki.doctype.wiki_document.wiki_sqlite_search import WikiSQLiteSearch, reindex_docs'
          if old_import not in text:
              raise SystemExit('WikiSQLiteSearch import anchor missing')
          text = text.replace(old_import, new_import, 1)

          old_merge = '''\t\tupdate_cr_page(cr.name, page_key, {"content": "freshtermv2zzz"})\n\n\t\tdrain_search_index_queue()\n\n\t\tenqueue_reindex.assert_called_once_with([page.name])'''
          new_merge = '''\t\tupdate_cr_page(cr.name, page_key, {"content": "freshtermv2zzz"})\n\n\t\twith patch(\n\t\t\t"wiki.frappe_wiki.doctype.wiki_document.wiki_sqlite_search.enqueue_reindex"\n\t\t) as enqueue_reindex:\n\t\t\t_approve_and_merge(cr.name)\n\n\t\tdrain_search_index_queue()\n\n\t\tenqueue_reindex.assert_called_once_with([page.name])'''
          if old_merge not in text:
              raise SystemExit('search reindex merge anchor missing')
          test_path.write_text(text.replace(old_merge, new_merge, 1))

          ui_path = Path('.github/workflows/ui-tests.yml')
          ui = ui_path.read_text()
          old_diag = '''      - name: Show Bench Logs on Failure\n        if: failure()\n        working-directory: /home/runner/frappe-bench\n        run: |\n          echo "=== Bench Start Log ==="\n          cat bench_start.log || true\n          echo ""\n          echo "=== Frappe Logs ==="\n          cat logs/*.log || true'''
          new_diag = '''      - name: Show Bench Logs on Failure\n        if: failure()\n        run: |\n          if [ -d /home/runner/frappe-bench ]; then\n            cd /home/runner/frappe-bench\n            echo "=== Bench Start Log ==="\n            cat bench_start.log || true\n            echo ""\n            echo "=== Frappe Logs ==="\n            cat logs/*.log || true\n          else\n            echo "=== Bench directory missing ==="\n            echo "Failure occurred before bench initialization."\n          fi'''
          if old_diag not in ui:
              raise SystemExit('UI failure diagnostic anchor missing')
          ui_path.write_text(ui.replace(old_diag, new_diag, 1))
          PY
          git add wiki/frappe_wiki/doctype/wiki_change_request/wiki_change_request_test_base.py .github/workflows/ui-tests.yml
          git commit -m "fix(wiki): repair reindex regression and CI diagnostics"

      - name: Normalize private overlay with pre-commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pre-commit
          git merge-base --is-ancestor "$OFFICIAL_WIKI_SHA" HEAD
          pre-commit run --from-ref "$OFFICIAL_WIKI_SHA" --to-ref HEAD || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(wiki): normalize private v3.2.1 overlay"
          fi
          pre-commit run --from-ref "$OFFICIAL_WIKI_SHA" --to-ref HEAD

      - name: Push repair
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/wiki-v3.2.1-runtime-closeout-repair-20261002
