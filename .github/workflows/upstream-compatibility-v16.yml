name: Upstream Compatibility v16

on:
  push:
    branches:
      - version-16
      - compat/wiki-v3.2.1-version-16
  pull_request:
    branches:
      - version-16

concurrency:
  group: version-16-wiki-upstream-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FRAPPE_REF: v16.34.0
  OFFICIAL_WIKI_SHA: 0c0adb06b9deb84d11d1f95e85df891c2a29f8da

jobs:
  server:
    runs-on: ubuntu-latest
    name: Frappe 16.34.0 / Wiki 3.2.1 CN candidate

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify exact Wiki 3.2.1 lineage and CN capability seams
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          ns = {}
          exec(open('wiki/__init__.py', encoding='utf-8').read(), ns)
          print(ns['__version__'])
          PY
          )" = "3.2.1"
          git merge-base --is-ancestor "$OFFICIAL_WIKI_SHA" HEAD
          grep -Fq 'def search_roles(' wiki/api/wiki_space.py
          grep -Fq "url: 'wiki.api.wiki_space.search_roles'" frontend/src/components/SpaceSettings/AccessPanel.vue
          grep -Fq '{{ __(row.role) }}' frontend/src/components/SpaceSettings/AccessPanel.vue
          test -f wiki/frappe_wiki/doctype/wiki_document/test_wiki_sqlite_search_compat.py
          test -f tests/test_sync_status_i18n_static.py
          test -f tests/test_image_viewer_zoom_static.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Run CN static contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_sync_status_i18n_static.py tests/test_image_viewer_zoom_static.py
          node scripts/check-cn-i18n-foundation.mjs
          node scripts/check-cn-public-actions.mjs
          node scripts/check-cn-seed.mjs
          node scripts/check-cn-visible-brand.mjs

      - name: Initialize pinned Frappe bench
        run: |
          pip install frappe-bench
          bench init --frappe-branch "$FRAPPE_REF" --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Wiki
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app wiki $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app wiki
          bench --site test_site migrate
          bench build --app wiki
        env:
          CI: "Yes"

      - name: Run Wiki tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app wiki
        env:
          TYPE: server
